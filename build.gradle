plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"kultivator" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Every module writes its texts to lang-src/<module>.<language>.json; this merges them into the real language files
// and fails when a key is defined twice or exists in only one of en_us / id_id.
def langSourceDir = file("lang-src")
def langOutputDir = layout.buildDirectory.dir("generated/lang")
def mergeLang = tasks.register("mergeLang") {
	inputs.dir(langSourceDir)
	outputs.dir(langOutputDir)
	def sourceDir = langSourceDir
	def outputDir = langOutputDir
	doLast {
		def languages = ["en_us", "id_id"]
		def merged = [:]
		languages.each { code ->
			def all = new TreeMap()
			def owners = [:]
			sourceDir.listFiles().findAll { it.name.endsWith(".${code}.json") }.sort { it.name }.each { file ->
				def parsed = new groovy.json.JsonSlurper().parse(file, "UTF-8")
				parsed.each { key, value ->
					if (all.containsKey(key)) {
						throw new GradleException("Language key '${key}' is defined in both ${owners[key]} and ${file.name}")
					}
					all[key] = value
					owners[key] = file.name
				}
			}
			merged[code] = all
		}
		def onlyEnglish = merged["en_us"].keySet() - merged["id_id"].keySet()
		def onlyIndonesian = merged["id_id"].keySet() - merged["en_us"].keySet()
		if (!onlyEnglish.isEmpty() || !onlyIndonesian.isEmpty()) {
			throw new GradleException("Language keys missing in id_id: ${onlyEnglish}; missing in en_us: ${onlyIndonesian}")
		}
		languages.each { code ->
			def out = new File(outputDir.get().asFile, "assets/kultivator/lang/${code}.json")
			out.parentFile.mkdirs()
			out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged[code])), "UTF-8")
		}
	}
}

sourceSets.main.resources.srcDir(mergeLang)

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
